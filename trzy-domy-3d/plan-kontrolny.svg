  <g id="text_11">
   <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #42695b" transform="translate(773.568 327.267469)">/190: +2,07 m ku górze działki</text>
   <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #42695b" transform="translate(773.568 341.087273)">+2,12 m w bok; lustro zachowane.</text>
   <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #42695b" transform="translate(773.568 351.952)"/>
   <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #42695b" transform="translate(773.568 368.067469)">/191: już na górnym limicie 5 m;</text>
   <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #42695b" transform="translate(773.568 381.497469)">od granicy SE minimum 10,5 m.</text>
   <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #42695b" transform="translate(773.568 395.097469)">Lustro i oryginalny garaż.</text>
   <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #42695b" transform="translate(773.568 406.352)"/>
